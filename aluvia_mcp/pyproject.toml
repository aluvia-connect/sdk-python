[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aluvia-mcp"
version = "1.0.0"
description = "Aluvia MCP server - Model Context Protocol tools for browser sessions and account management"
authors = [{name = "Aluvia", email = "support@aluvia.io"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
keywords = ["mcp", "model-context-protocol", "aluvia", "ai-agent", "browser-automation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "aluvia-sdk>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "mypy>=1.0.0",
    "black>=23.0.0",
]

[project.scripts]
aluvia-mcp = "aluvia_mcp.mcp_server:run"

[project.urls]
Homepage = "https://aluvia.io"
Documentation = "https://docs.aluvia.io"
Repository = "https://github.com/aluvia-connect/sdk-python"
Issues = "https://github.com/aluvia-connect/sdk-python/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["aluvia_mcp*"]

[tool.setuptools.package-data]
aluvia_mcp = ["py.typed"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
