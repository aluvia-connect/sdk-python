name: Publish to TestPyPI

on:
  workflow_dispatch: # Manual trigger only
  push:
    tags:
      - "v*-test" # Tags like v1.2.0-test will trigger TestPyPI upload

jobs:
  publish-sdk-test:
    name: Publish SDK to TestPyPI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-dev.txt

      - name: Run SDK unit tests
        run: |
          pytest tests/ -v

      - name: Build SDK package
        run: |
          pip install build
          python -m build

      - name: Publish SDK to TestPyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: |
          pip install twine
          twine upload --repository testpypi dist/*

  publish-mcp-test:
    name: Publish MCP to TestPyPI
    runs-on: ubuntu-latest
    needs: publish-sdk-test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SDK first
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install MCP dependencies
        run: |
          cd aluvia_mcp
          pip install -e .

      - name: Run MCP tests
        run: |
          cd aluvia_mcp
          python test_mcp_import.py
          python test_stdio.py

      - name: Build MCP package
        run: |
          cd aluvia_mcp
          pip install build
          python -m build

      - name: Publish MCP to TestPyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: |
          pip install twine
          cd aluvia_mcp
          twine upload --repository testpypi dist/*
