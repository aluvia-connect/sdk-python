name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    tags:
      - "v*" # Trigger on version tags like v1.2.0
  pull_request:
    branches: [main, develop]
  release:
    types: [published]

jobs:
  test-sdk:
    name: Test SDK on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install SDK dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-dev.txt

      - name: Run SDK unit tests
        run: |
          pytest tests/ -v --tb=short

      - name: Check code formatting with black
        run: |
          black --check aluvia_sdk/ tests/
        continue-on-error: true

      - name: Run type checking with mypy
        run: |
          mypy aluvia_sdk/
        continue-on-error: true

  test-mcp:
    name: Test MCP Server on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install SDK first (dependency)
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install MCP package
        run: |
          cd aluvia_mcp
          pip install -e .
          pip install pytest pytest-asyncio

      - name: Run MCP import test
        run: |
          cd aluvia_mcp
          python test_mcp_import.py

      - name: Run MCP stdio test
        run: |
          cd aluvia_mcp
          python test_stdio.py

  lint:
    name: Lint and Style Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run flake8
        run: |
          flake8 aluvia_sdk/ tests/ --max-line-length=120 --extend-ignore=E203,W503
        continue-on-error: true

  build-sdk:
    name: Build SDK Package
    runs-on: ubuntu-latest
    needs: test-sdk

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build setuptools wheel

      - name: Build SDK package
        run: |
          python -m build

      - name: Check SDK package
        run: |
          pip install twine
          twine check dist/*

      - name: Upload SDK build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sdk-dist-packages
          path: dist/
          retention-days: 7

  build-mcp:
    name: Build MCP Package
    runs-on: ubuntu-latest
    needs: [test-sdk, test-mcp]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build setuptools wheel

      - name: Build MCP package
        run: |
          cd aluvia_mcp
          python -m build

      - name: Check MCP package
        run: |
          pip install twine
          twine check aluvia_mcp/dist/*

      - name: Upload MCP build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mcp-dist-packages
          path: aluvia_mcp/dist/
          retention-days: 7

  publish-sdk:
    name: Publish SDK to PyPI
    runs-on: ubuntu-latest
    needs: [test-sdk, test-mcp, build-sdk]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build SDK package
        run: |
          python -m build

      - name: Publish SDK to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          twine upload dist/*

  publish-mcp:
    name: Publish MCP to PyPI
    runs-on: ubuntu-latest
    needs: [test-sdk, test-mcp, build-mcp, publish-sdk]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build MCP package
        run: |
          cd aluvia_mcp
          python -m build

      - name: Publish MCP to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_MCP_API_TOKEN }}
        run: |
          cd aluvia_mcp
          twine upload dist/*
